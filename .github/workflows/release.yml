name: Release NekoDown GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/src-tauri

      - name: Build Tauri release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./gui-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'NekoDown ${{ github.ref_name }}'
          releaseBody: |
            ## NekoDown ${{ github.ref_name }}

            Cloudreve share downloader optimised for the NekoGAL community.

            ### Downloads

            - `NekoDown_*_x64-setup.exe` — NSIS installer (recommended)
            - `NekoDown_*_x64-portable.zip` — portable zip (extract and run nekodown-gui.exe)

            See README for usage.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "NekoDown_${tag}_x64-portable.zip"
          $tmp = New-Item -ItemType Directory -Path "portable-tmp"
          # Copy exe
          Copy-Item "gui-tauri/src-tauri/target/release/nekodown-gui.exe" "$tmp/nekodown-gui.exe"
          # Copy resources
          Copy-Item -Recurse "lib" "$tmp/lib"
          Copy-Item "lang.json" "$tmp/lang.json"
          Copy-Item "config.json" "$tmp/config.json"
          Copy-Item "neko-down.ps1" "$tmp/neko-down.ps1"
          Copy-Item "双击运行.cmd" "$tmp/双击运行.cmd"
          Copy-Item "README.md" "$tmp/README.md"
          # Create zip
          Compress-Archive -Path "$tmp/*" -DestinationPath $zipName
          Remove-Item -Recurse -Force $tmp
          Write-Host "Created $zipName"

      - name: Upload portable zip
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "NekoDown_${tag}_x64-portable.zip"
          if (Test-Path $zip) {
            gh release upload $tag $zip --repo Arcohyp/NekoDown --clobber
          } else {
            Write-Host "Portable zip not found at $zip"
            exit 1
          }
