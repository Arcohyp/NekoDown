[package]
name = "nekodown-gui"
version = "0.1.0"
description = "NekoDown GUI - Cloudreve share downloader optimised for NekoGAL"
authors = ["NekoDown contributors"]
edition = "2021"

[lib]
name = "nekodown_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
